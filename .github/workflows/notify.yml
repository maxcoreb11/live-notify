name: Live Stream Notify

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run notifier
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          LEAD_MINUTES: "60,30,10,0"
        run: python notify_bot.py

      - name: Commit updated schedule
        run: |
          git config user.name "live-notify-bot"
          git config user.email "actions@users.noreply.github.com"
          git add schedule.json
          git diff --staged --quiet || git commit -m "update notified status [skip ci]"
          git push
